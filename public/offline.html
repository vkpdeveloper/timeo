<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · Timeo</title>
<style>
  :root { color-scheme: light dark; --bg:#F6F6F3; --ink:#121513; --ink2:#565C58; --accent:#1F6B50; --accent-ink:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0C0E0D; --ink:#ECEFED; --ink2:#A4ABA7; --accent:#5CC495; --accent-ink:#07140E; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; text-align:center; padding:24px; }
  img { width:56px; height:56px; border-radius:16px; }
  h1 { font: 600 26px/1.15 ui-sans-serif, system-ui, sans-serif; letter-spacing:-0.02em; margin:24px 0 8px; }
  p { color:var(--ink2); margin:0 0 24px; }
  button { font:600 16px system-ui; min-height:44px; padding:12px 22px; border-radius:12px; border:0; background:var(--accent); color:var(--accent-ink); }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Timeo needs a connection to sync. Try again in a moment.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
