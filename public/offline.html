<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · Timeo</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f4f0; --ink:#18171a; --ink2:#5b5852; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --ink:#f3f2ee; --ink2:#aaa69f; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; text-align:center; padding:24px; }
  img { width:56px; height:56px; border-radius:16px; }
  h1 { font: 400 34px/1.1 ui-serif, Georgia, serif; margin:24px 0 8px; }
  p { color:var(--ink2); margin:0 0 24px; }
  button { font:600 15px system-ui; padding:12px 22px; border-radius:999px; border:0; background:var(--ink); color:var(--bg); }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Timeo needs a connection to sync. Try again in a moment.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
