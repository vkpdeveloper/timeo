# Sends due push reminders once, on demand. The 5-minute schedule runs on
# Cloudflare (cron/), so this is manual only. No secrets needed: the job
# proves it runs in this repository with a GitHub OIDC token, which
# /api/cron/notify verifies.
# Optional repository variable TIMEO_URL overrides the site URL.
name: Reminders

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminders
        env:
          TIMEO_URL: ${{ vars.TIMEO_URL || 'https://timeo-five.vercel.app' }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=timeo-cron" | jq -r .value)
          curl -fsS --retry 2 --max-time 90 -H "Authorization: Bearer $TOKEN" "$TIMEO_URL/api/cron/notify"
