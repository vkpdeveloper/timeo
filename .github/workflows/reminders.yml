# Sends due push reminders (blocks, gym, morning read, evening check-in…).
# Works on any Vercel plan. Needs two repository secrets:
#   TIMEO_URL    e.g. https://timeo.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminders
        env:
          TIMEO_URL: ${{ secrets.TIMEO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TIMEO_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set TIMEO_URL and CRON_SECRET repository secrets"; exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$TIMEO_URL/api/cron/notify"
